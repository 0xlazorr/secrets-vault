[package]
name = "secrets-vault"
version = "0.1.0"
edition = "2021"
authors = ["Lazarus Ebi <lazorronchain@gmail.com>"]
description = "Memory-Safe Encrypted Secrets & Key Management Vault in Rust"
license = "MIT"

[dependencies]
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
thiserror = "1.0"
